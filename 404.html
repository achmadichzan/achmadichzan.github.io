<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Node Not Found — Achmad Ichzan</title>
  <meta name="description" content="The requested resource could not be found on this server.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#F4F4F0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('portfolio_theme');
        if (t && ['dark', 'matrix', 'win95'].indexOf(t) !== -1) {
          document.documentElement.classList.add('theme-' + t);
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div class="master-wrapper" style="min-height: 100vh; display: flex; flex-direction: column;">
    <main id="main-content" class="frame-container"
      style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 4rem 2rem; text-align: center;">
      <section class="terminal-card" style="max-width: 580px; width: 100%;" aria-label="Error 404 Node Not Found">
        <div class="terminal-header">
          <span>HTTP_ERROR // 404</span>
          <span>[NOT_FOUND]</span>
        </div>
        <div class="terminal-body" style="text-align: left; padding: 2rem;">
          <h1
            style="font-size: 1.15rem; font-family: var(--font-headline); font-weight: 900; color: var(--accent-danger); margin-bottom: 1rem; letter-spacing: 0.5px;">
            &gt; ERROR_CODE: 404_PAGE_NOT_FOUND
          </h1>
          <p style="margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-body);">
            The requested target URL does not exist or has been relocated to another sector.
          </p>
          <hr class="dashed-line" style="margin: 1.5rem 0;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <a href="/" class="hero-cta-btn" style="padding: 0.65rem 1.25rem;">
              [RETURN_TO_BASE -&gt;]
            </a>
            <a href="https://github.com/achmadichzan" target="_blank" rel="noopener noreferrer" class="hero-cta-btn"
              style="background: var(--bg-subtle); padding: 0.65rem 1.25rem;">
              [GITHUB]
            </a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
